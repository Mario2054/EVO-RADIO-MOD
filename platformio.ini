[env:4d_systems_esp32s3_gen4_r8n16]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = 4d_systems_esp32s3_gen4_r8n16

build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=0    ; Serial Monitor on Serial0
	-DARDUINO_USB_MODE=1           ; Serial on USBCDC
	-IC:/Users/Mariu/.platformio/packages/framework-arduinoespressif32/libraries/DNSServer/src
	-IC:/Users/Mariu/.platformio/packages/framework-arduinoespressif32/libraries/AsyncUDP/src
	-DESP32
	-DCORE_DEBUG_LEVEL=1           ; 1=ERROR only (optimized for production)
	; ========================================================================
	; COMPILER OPTIMIZATIONS - Optimized for SIZE (firmware compression)
	; ========================================================================
	-Os                            ; Optimize for SIZE (reduced flash usage)
	-ffunction-sections            ; Place each function in its own section
	-fdata-sections                ; Place each data in its own section
	-Wl,--gc-sections              ; Remove unused sections (reduce flash usage)
	-fno-exceptions                ; Disable C++ exceptions (save RAM)
	-fno-rtti                      ; Disable runtime type info (save RAM)
	-freorder-blocks               ; Reorder basic blocks for better cache
	-ffast-math                    ; Fast floating point math
	-DBOARD_HAS_PSRAM              ; Enable PSRAM support
	-mfix-esp32-psram-cache-issue  ; Fix PSRAM cache issues
	-DCONFIG_SPIRAM_CACHE_WORKAROUND ; Additional PSRAM cache fix
	-DCONFIG_SPIRAM_USE=1          ; Force PSRAM usage
	-DCONFIG_SPIRAM_SUPPORT=1      ; PSRAM support enabled
	; ========================================================================
	; ========================================================================
	; TCP/IP & WiFi OPTIMIZATIONS - ENHANCED FOR AUDIO STABILITY (settings5)
	; ========================================================================
	-DCONFIG_LWIP_TCP_WND_DEFAULT=32768     ; TCP receive window 32KB (było 16KB)
	-DCONFIG_LWIP_TCP_RECVMBOX_SIZE=32      ; TCP mailbox increased (było 6)
	-DCONFIG_LWIP_MAX_SOCKETS=10            ; Standard socket count
	-DCONFIG_TCP_MSS=1436                   ; TCP max segment size standard
	-DCONFIG_TCP_SND_BUF_DEFAULT=8192       ; TCP send buffer 8KB (było 32KB)
	-DCONFIG_LWIP_TCP_MAXRTX=6              ; Standard TCP retransmissions
	-DCONFIG_LWIP_TCP_SYNMAXRTX=3           ; TCP SYN standard retries
	-DCONFIG_LWIP_PBUF_POOL_SIZE=16         ; Standard protocol bufory
	-DCONFIG_LWIP_MEM_SIZE=65536            ; LWIP memory pool 64KB - standard
	-DCONFIG_LWIP_MAX_ACTIVE_TCP=16         ; Max active TCP connections
	-DCONFIG_LWIP_MAX_LISTENING_TCP=16      ; Max listening TCP connections
	-DCONFIG_LWIP_TCP_ACCEPTMBOX_SIZE=6     ; TCP accept mailbox
	-DCONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=12    ; Out-of-sequence max buffers
	; === OPTYMALIZACJA "NO AUDIO SAMPLES" ===
	-DCONFIG_AUDIO_BUFFER_EXTRA=1           ; Dodatkowe bufory audio
	-DCONFIG_FREERTOS_TASK_WATCHDOG_TIMEOUT_S=10  ; Zwiększ timeout watchdog (było 5s)
	-DCONFIG_FREERTOS_IDLE_TASK_WATCHDOG_TIMEOUT_S=10  ; Zwiększ idle timeout
	-DCONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096     ; Większy stos dla event task
	; ========================================================================
	-finline-functions             ; Inline small functions (speed optimization)
	-finline-limit=64              ; Inline functions up to 64 instructions
	; ========================================================================
	; FLAC PERFORMANCE OPTIMIZATIONS
	; ========================================================================
	-DCONFIG_FREERTOS_HZ=1000      ; Increase FreeRTOS tick frequency for better FLAC timing
	-DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240  ; Ensure max CPU frequency for FLAC decoding
	-DCONFIG_SPIRAM_SPEED_80M=1    ; Maximize PSRAM speed for large FLAC buffers
	-DCONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=0   ; Disable WiFi TX aggregation - standard
	-DCONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=0   ; Disable WiFi RX aggregation - standard
	-DCONFIG_ESP32_WIFI_RX_BA_WIN=6          ; Standard WiFi block ACK window
	-DCONFIG_ESP32_WIFI_TX_BA_WIN=8          ; WiFi TX block ACK window (settings5)
	-DCONFIG_LWIP_TCP_TMR_INTERVAL=100       ; Standard TCP timer 100ms
	-DCONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=1  ; Standard TLS pointers
	-DCONFIG_LWIP_TCPIP_TASK_STACK_SIZE=3072 ; Standard TCP/IP task stack
	-DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384  ; SSL input buffer 16KB - standard
	-DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096  ; SSL output buffer 4KB - standard
	-DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8 ; WiFi RX buffers (było 10, settings5)
	-DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=64 ; Dynamic WiFi buffers (było 32, settings5)
	-fipa-pta                      ; Inter-procedural pointer analysis
	-fmerge-all-constants          ; Merge identical constants (reduce flash)
	-DNDEBUG                       ; Disable assertions (save RAM & speed)
	-std=gnu++17                   ; Use C++17 standard (better optimization)
	-DAUTOSTORAGE                  ; Enable automatic SD/LittleFS storage selection
	; ========================================================================
	; FFT ANALYZER & GRAPHIC EQUALIZER - WŁĄCZANIE/WYŁĄCZANIE
	; ========================================================================
	; ENABLE_FFT_ANALYZER - Analizator widma FFT (VU meter style 5-10)
	;   1 = WŁĄCZONY  - Wyświetlanie spectrum audio
	;   0 = WYŁĄCZONY - Tylko style VU meter 0-4
	;   Koszt: ~25KB RAM, ~20% CPU Core1
	; 
	; ENABLE_EQ16 - Graficzny equalizer 16-pasmowy (modyfikacja audio)
	;   1 = WŁĄCZONY  - Możliwość kształtowania dźwięku przez 16 pasm
	;   0 = WYŁĄCZONY - Tylko 3-punktowy equalizer (bass/mid/treble)
	;   Koszt: ~15KB RAM, ~10% CPU podczas przetwarzania
	; 
	; ZALECANE USTAWIENIA:
	;   Tylko widmo:     FFT=1, EQ16=0  (oszczędność CPU na EQ)
	;   Pełna kontrola:  FFT=1, EQ16=1  (wszystko włączone)
	;   Minimum:         FFT=0, EQ16=0  (maksymalna wydajność)
	; ========================================================================
	-DENABLE_FFT_ANALYZER=1
	-DENABLE_EQ16=1

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_port = COM23

lib_deps = 
  arduinogetstarted/ezButton@^1.0.6
  olikraus/U8g2@^2.36.5
  tzapu/WiFiManager@^2.0.17
  ; ========================================================================
  ; ESP32-audioI2S v3.4.4 - Zaktualizowana biblioteka audio
  ; Źródło: https://github.com/schreibfaul1/ESP32-audioI2S.git
  ; Wersja: 3.4.4+sha.674c64a (najnowsza stabilna)
  ; ========================================================================
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.4
  ESP32Async/ESPAsyncWebServer @3.7.7
  ESP32Async/AsyncTCP @3.4.1
  bblanchon/ArduinoJson@^6.21.3


lib_extra_dirs = lib
